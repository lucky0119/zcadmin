<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="lg-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lg-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- 高光 -->
  <ellipse cx="22" cy="14" rx="16" ry="7" fill="#ffffff" fill-opacity="0.14"/>

  <!-- 盾牌 -->
  <path d="M32 13 L47 18.5 V33 C47 42 41 47.5 32 51 C23 47.5 17 42 17 33 V18.5 Z" fill="url(#lg-shield)"/>
  <path d="M32 13 L47 18.5 V33 C47 42 41 47.5 32 51 C23 47.5 17 42 17 33 V18.5 Z" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.4"/>

  <!-- 对勾 -->
  <path d="M24.5 32.5 L30 38 L40 26.5" fill="none" stroke="#2563eb" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24.5 32.5 L30 38 L40 26.5" fill="none" stroke="#4f46e5" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.45"/>

  <!-- 状态点 -->
  <circle cx="48.5" cy="15.5" r="4.5" fill="#ffffff"/>
  <circle cx="48.5" cy="15.5" r="2" fill="#f59e0b"/>
</svg>
